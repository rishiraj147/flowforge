<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Workflow failed</title>
  </head>
  <body style="font-family: system-ui, sans-serif; color: #111; line-height: 1.5;">
    <h2 style="color: #b91c1c;">Workflow run failed</h2>
    <p>Hi {{ recipient_name or recipient_email }},</p>
    <p>
      Your workflow <strong>{{ workflow_name }}</strong> did not complete successfully.
    </p>
    <table style="margin: 1rem 0; border-collapse: collapse;">
      <tr>
        <td style="padding: 4px 12px 4px 0;"><strong>Execution</strong></td>
        <td>{{ execution_id }}</td>
      </tr>
      <tr>
        <td style="padding: 4px 12px 4px 0;"><strong>Trigger</strong></td>
        <td>{{ trigger_source }}</td>
      </tr>
      <tr>
        <td style="padding: 4px 12px 4px 0;"><strong>Finished</strong></td>
        <td>{{ finished_at }}</td>
      </tr>
      {% if error_message %}
      <tr>
        <td style="padding: 4px 12px 4px 0;"><strong>Error</strong></td>
        <td style="color: #b91c1c;">{{ error_message }}</td>
      </tr>
      {% endif %}
    </table>
    <p style="color: #666; font-size: 0.9rem;">
      — {{ app_name }}
    </p>
  </body>
</html>
