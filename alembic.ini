# Alembic config. The DB URL is intentionally NOT hardcoded here — env.py pulls
# it from your Pydantic Settings so there is ONE source of truth for config.

[alembic]
script_location = migrations

# Make 'from flowforge...' importable when alembic runs from the repo root.
prepend_sys_path = . src

# Timestamped, sortable migration filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console
qualname =


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S