[tool.poetry]
name = "flowforge"
version = "0.1.0"
description = "FlowForge - a FastAPI service."
authors = ["Rishi Kumar <rishiraj969r@gmail.com>"]
readme = "README.md"

# Tell Poetry where the importable package lives. This is what makes the
# src/ layout work: the package is at src/flowforge, imported as 'flowforge'.
packages = [{ include = "flowforge", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"

fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
pydantic-settings = "^2.5.0"
python-multipart = "^0.0.12"    # file uploads (UploadFile)

# Async clients for the services in docker-compose:
asyncpg = "^0.30.0" # PostgreSQL driver (async)
redis = "^5.1.0"    # redis-py includes async support (redis.asyncio)
celery = {extras = ["redis"], version = "^5.3.0"}
psycopg = {extras = ["binary"], version = "^3.2.0"}
# ----- ORM  + migrations (added for the DB layer) -----
sqlalchemy={extras = ["asyncio"], version= "^2.0.35" } # pulls in greenlet
alembic = "^1.13.0"
greenlet = "^3.5.1"

# --- auth ---
bcrypt = "^4.2.0"               # password hashing
pyjwt = "^2.9.0"                # JWT encode/decode/verify
email-validator = "^2.2.0"      # required for pydantic EmailStr

# --- scheduling ---
apscheduler = "^3.10.4"         # cron jobs inside FastAPI (AsyncIOScheduler)
croniter = "^2.0.5"             # parse/evaluate cron expressions

# --- object storage (S3 / MinIO) ---
boto3 = "^1.35.0"

# --- email notifications ---
jinja2 = "^3.1.4"

# --- observability (Prometheus) ---
prometheus-client = "^0.21.0"
prometheus-fastapi-instrumentator = "^7.0.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.0"   # FastAPI TestClient + async client
ruff = "^0.7.0"     # linter + formatter
locust = "^2.32.0"  # load testing (load_tests/)

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]